# Alert rules, provisioned from git. Each rule: query (A) -> last value (B) -> threshold (C).
# Annotation templates use Go template syntax: $values.B.Value, $labels.name.

apiVersion: 1

groups:
  - orgId: 1
    name: homelab
    folder: Homelab
    interval: 1m
    rules:
      - uid: on-battery
        title: Server on battery
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'Server is running on battery ({{ printf "%.0f" $values.E.Value }}% left). Check the charger.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'node_power_supply_online{power_supply="ADP0"}', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [1] } } ] }
          - refId: D
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: D, expr: 'node_power_supply_capacity{power_supply="BAT0"}', range: true }
          - refId: E
            datasourceUid: __expr__
            model: { refId: E, type: reduce, expression: D, reducer: last }

      - uid: battery-low
        title: Battery low
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'Battery at {{ printf "%.0f" $values.B.Value }}%. The server shuts down when it runs out.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'node_power_supply_capacity{power_supply="BAT0"}', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [25] } } ] }

      - uid: cpu-hot
        title: CPU hot
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'CPU at {{ printf "%.0f" $values.B.Value }} °C for 5 minutes.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'max(node_hwmon_temp_celsius * on(chip) group_left(chip_name) node_hwmon_chip_names{chip_name="coretemp"})', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [85] } } ] }

      - uid: disk-filling
        title: Disk filling up
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'Disk is {{ printf "%.0f" $values.B.Value }}% full.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: '100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [85] } } ] }

      - uid: memory-high
        title: Memory almost full
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'Memory {{ printf "%.0f" $values.B.Value }}% used for 10 minutes.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: '100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [90] } } ] }

      - uid: container-down
        title: Container not running
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'Container {{ $labels.name }} is not running.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'homelab_container_running', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [1] } } ] }

      - uid: service-down
        title: Service not responding
        condition: C
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: '{{ $labels.service }} is not responding ({{ $labels.instance }}).'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'probe_success{job="services"}', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [1] } } ] }

      - uid: backup-stale
        title: Backup overdue
        condition: C
        for: 0s
        # No data = no backup has ever run yet; stay quiet until the first one exists
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'Last successful backup was {{ printf "%.0f" $values.B.Value }} hours ago.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: '(time() - homelab_backup_last_success_timestamp_seconds) / 3600', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [26] } } ] }

      - uid: backup-disk-missing
        title: Backup disk missing
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'The backup USB disk is not mounted. Tonight''s backup will fail until it is plugged back in.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'homelab_backup_disk_mounted', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [1] } } ] }

      - uid: backup-disk-health
        title: Backup disk failing
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'The backup disk reports problems (SMART failed or bad sectors). Replace it soon.'
        data:
          - refId: A
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: '(1 - homelab_disk_smart_passed) + homelab_disk_reallocated_sectors + homelab_disk_pending_sectors', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [0] } } ] }

      - uid: offsite-stale
        title: Off-site backup overdue
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'Last off-site copy to Cloudflare R2 was {{ printf "%.0f" $values.B.Value }} hours ago (the local backup may still be fine).'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: '(time() - homelab_offsite_last_success_timestamp_seconds) / 3600', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [26] } } ] }

      - uid: offsite-size
        title: Off-site backup near free tier
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'Off-site backup is {{ printf "%.1f" $values.B.Value }} GB. Cloudflare R2 is free up to 10 GB, then about $0.015 per GB a month.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'homelab_offsite_repo_size_bytes / 1e9', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [9] } } ] }

      - uid: tunnel-down
        title: Cloudflare Tunnel down
        condition: C
        for: 3m
        # No data = cloudflared itself is gone, which is just as down
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'Cloudflare Tunnel has no connections: cloud and n8n are offline for the internet (still fine over Tailscale).'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'cloudflared_tunnel_ha_connections', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [1] } } ] }

      - uid: metrics-missing
        title: Server metrics missing
        condition: C
        for: 3m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'No metrics from node_exporter: the dashboard and the other alerts are blind.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, expr: 'up{job="node"}', range: true }
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [1] } } ] }
